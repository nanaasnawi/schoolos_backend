[package]
name = "school-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Identifiers
uuid = { version = "1.8", features = ["v4", "serde", "v7"] }

# Dates & Times
chrono = { version = "0.4", features = ["serde"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
dotenvy = "0.15"
async-trait = "0.1.89"
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
config = "0.15.25"
tracing = "0.1.44"
sha2 = "0.10"
hex = "0.4"

