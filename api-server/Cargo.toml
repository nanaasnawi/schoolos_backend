[package]
name = "api-server"
version = "0.1.0"
edition = "2024"
default-run = "api-server"


[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
school-core = { version = "0.1.0", path = "../school-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "request-id", "util", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.4", features = ["serde", "v7"] }
